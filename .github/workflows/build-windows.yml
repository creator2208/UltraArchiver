name: Build UltraArchiver 2.4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate application icon resources
        shell: pwsh
        run: .\assets\generate-brand.ps1
      - name: Build Rust application
        run: cargo build --release --target x86_64-pc-windows-msvc --bin ultraarchiver
      - name: Prepare app payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\ultraarchiver.exe dist\UltraArchiver.exe
      - name: Build Explorer extension
        shell: cmd
        run: cl /nologo /LD /EHsc /std:c++17 shell\UltraArchiverShell.cpp /link /OUT:dist\UltraArchiverShell.dll ole32.lib shell32.lib advapi32.lib user32.lib
      - name: Build native custom setup application
        run: cargo build --release --target x86_64-pc-windows-msvc --bin ultraarchiver-setup
      - name: Prepare distributable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\ultraarchiver-setup.exe package\UltraArchiver-Setup.exe
          Copy-Item dist\* package\
          Compress-Archive -Path package\* -DestinationPath UltraArchiver-2.4-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UltraArchiver-2.4-Windows-x64
          path: UltraArchiver-2.4-Windows-x64.zip
          if-no-files-found: error
