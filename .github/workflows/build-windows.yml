name: Build UltraArchiver for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller and 7-Zip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install 7zip.install --yes --no-progress
      - name: Compile Python source
        run: python -m py_compile ultraarchiver.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name UltraArchiver ultraarchiver.py
      - name: Bundle 7-Zip engine
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip"
          Copy-Item (Join-Path $sevenZip "7z.exe") "dist\7z.exe"
          Copy-Item (Join-Path $sevenZip "7z.dll") "dist\7z.dll"
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "UltraArchiver-Windows-x64.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraArchiver-Windows-x64
          path: UltraArchiver-Windows-x64.zip
          if-no-files-found: error
