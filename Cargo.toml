[package]
name = "ultraarchiver"
version = "2.0.0"
edition = "2021"
build = "build.rs"
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
[build-dependencies]
cc = "1.2"
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
