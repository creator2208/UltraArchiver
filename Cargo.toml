[package]
name = "ultraarchiver"
version = "2.3.0"
edition = "2021"
build = "build.rs"
default-run = "ultraarchiver"

[[bin]]
name = "ultraarchiver"
path = "src/main.rs"

[[bin]]
name = "ultraarchiver-setup"
path = "installer/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
blake3 = "1.5"
walkdir = "2.5"

[build-dependencies]
cc = "1.2"
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
